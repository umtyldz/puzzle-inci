<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Renkli Puzzle Dünyası 🧩</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Oyun Ana Kapsayıcı (Yatay Mod Odaklı) -->
  <div id="game-app">
    
    <!-- Üst Kontrol Çubuğu (Görsel ve Büyük Butonlar) -->
    <header id="top-bar">
      <div class="logo-area">
        <span class="logo-icon">🧩</span>
        <span class="logo-title">PUZZLE</span>
      </div>

      <div class="action-buttons">
        <!-- Giriş / Resim ve Parça Seçimi -->
        <button id="btn-open-setup" class="btn btn-primary" title="Yeni Resim ve Parça Seç">
          <span class="icon">🎨</span>
          <span class="btn-text">Yeni Puzzle</span>
        </button>

        <!-- Parça Sayısı Seçimi -->
        <button id="btn-pieces-modal" class="btn btn-info" title="Parça Sayısını Değiştir">
          <span class="icon">🧩</span>
          <span id="current-pieces-badge" class="badge">6</span>
        </button>

        <!-- İpucu / Hayalet Resim Butonu (Göz) -->
        <button id="btn-hint" class="btn btn-warning" title="Resmi Göster / Gizle">
          <span class="icon" id="hint-icon">👁️</span>
        </button>

        <!-- Ses Aç / Kapa -->
        <button id="btn-sound" class="btn btn-icon" title="Ses">
          <span class="icon" id="sound-icon">🔊</span>
        </button>

        <!-- Karıştır / Yeniden Başlat -->
        <button id="btn-restart" class="btn btn-icon" title="Yeniden Başlat">
          <span class="icon">🔄</span>
        </button>

        <!-- Tam Ekran Butonu -->
        <button id="btn-fullscreen" class="btn btn-icon" title="Tam Ekran">
          <span class="icon">⛶</span>
        </button>
      </div>
    </header>

    <!-- Oyun Sahnesi (Yatay İkiye Bölünmüş: Solda Pano, Sağda Parça Havuzu) -->
    <main id="play-area">
      <!-- Sol Taraf: Puzzle Tahtası / Çerçevesi -->
      <section id="board-container">
        <div id="board-wrapper">
          <div id="board">
            <!-- Hayalet / Arka Plan İpucu Resmi -->
            <img id="board-hint-img" alt="İpucu Resmi">
            <!-- İnce kılavuz ızgara çizgileri -->
            <svg id="board-grid-svg"></svg>
            <!-- Yerine oturan parçaların kilitlendiği katman -->
            <div id="board-locked-pieces"></div>
          </div>
        </div>

        <!-- Köşe Tam Resim Önizleme (Göz kapalıyken açılır, büyütülüp kaydırılabilir) -->
        <div id="ref-preview-box" class="hidden" aria-label="Tam Resim Önizleme">
          <div class="ref-preview-controls">
            <button id="btn-ref-zoom-out" class="ref-btn" title="Uzaklaştır">➖</button>
            <button id="btn-ref-zoom-in" class="ref-btn" title="Yakınlaştır">➕</button>
            <button id="btn-ref-reset" class="ref-btn" title="Sıfırla">↺</button>
            <button id="btn-ref-size" class="ref-btn" title="Büyüt / Küçült">⤢</button>
          </div>
          <div id="ref-preview-viewport">
            <img id="ref-preview-img" alt="Tam Resim" draggable="false">
          </div>
        </div>
      </section>

      <!-- Sağ Taraf: Parça Çekmecesi / Tepsi -->
      <section id="tray-container">
        <div class="tray-header">
          <span class="tray-icon">🎈</span>
          <span class="tray-counter" id="tray-counter">0 / 6</span>
        </div>
        <div id="tray-scroll">
          <div id="tray-pieces">
            <!-- Serbest parçalar buraya yerleşir -->
          </div>
        </div>
      </section>
    </main>

    <!-- Yüzen / Sürüklenen Parçalar Katmanı -->
    <div id="floating-pieces-layer"></div>

    <!-- GİRİŞ / KURULUM EKRANI (Üstte Parça Sayısı, Ortada Yükle + Link, Altta Galeri) -->
    <div id="modal-setup" class="modal-backdrop">
      <div class="modal-card setup-modal-card">
        <div class="modal-header setup-modal-header">
          <h2>🧩 Yeni Puzzle</h2>
          <div class="setup-header-actions">
            <button id="btn-setup-resume" class="btn btn-accent hidden">▶️ Mevcut Resimle Oyna</button>
            <button id="btn-setup-close" class="modal-close hidden" data-close="modal-setup">✖</button>
          </div>
        </div>

        <!-- 1. ÜSTTE: PARÇA SAYISI -->
        <div class="setup-section">
          <div class="setup-section-header">
            <span class="setup-section-title">🧩 Parça Sayısı</span>
            <span id="custom-pieces-preview" class="custom-pieces-preview">3 × 2 = 6 Parça</span>
          </div>
          <div id="piece-options-grid" class="piece-options-grid"></div>
          <div class="setup-custom-row">
            <span class="setup-custom-label">🎛️ Özel (4 - 500)</span>
            <input type="range" id="custom-pieces-slider" min="4" max="500" step="1" value="6">
            <input type="number" id="custom-pieces-input" min="4" max="500" value="6">
          </div>
        </div>

        <!-- 2. ORTADA: UPLOAD + LINK SATIRI -->
        <div class="setup-upload-row">
          <label class="btn btn-primary setup-upload-btn" title="Cihazdan Resim Seç">
            <span>📷</span>
            <span>Resim Yükle</span>
            <input type="file" id="file-input" accept="image/*" hidden>
          </label>
          <div class="setup-url-group">
            <span class="setup-url-icon">🔗</span>
            <input type="url" id="url-input-field" placeholder="Resim linki yapıştır (https://...)">
            <button id="btn-load-url" class="btn btn-secondary">🚀 Yükle</button>
          </div>
        </div>

        <!-- 3. ALTTA: GALERİ BÖLÜMÜ -->
        <div class="setup-gallery-section">
          <div id="recent-images-section" class="recent-section hidden">
            <h3 class="gallery-section-title">🕒 Son Görseller</h3>
            <div id="recent-grid" class="presets-grid"></div>
          </div>
          <h3 class="gallery-section-title">🎨 Hazır Resimler</h3>
          <div id="presets-grid" class="presets-grid">
            <!-- Hazır resim kartları JS ile eklenecek -->
          </div>
        </div>
      </div>
    </div>

    <!-- KUTLAMA / TEBRİKLER EKRANI (Tüm parçalar bitince) -->
    <div id="celebration-overlay" class="hidden">
      <div class="celebration-box">
        <div class="trophy-bounce">🏆</div>
        <h1 class="celebration-title">HARİKA! BİTİRDİN! 🎉</h1>
        <p class="celebration-subtitle">Muhteşem bir iş çıkardın!</p>
        <div class="completed-image-preview">
          <img id="completed-img" alt="Tamamlanan Puzzle">
        </div>
        <div class="celebration-actions">
          <button id="btn-play-again" class="btn btn-large btn-primary">
            <span>🔄</span> Tekrar Oyna
          </button>
          <button id="btn-next-level" class="btn btn-large btn-accent">
            <span>🧩</span> Daha Fazla Parça!
          </button>
          <button id="btn-choose-new" class="btn btn-large btn-secondary">
            <span>🎨</span> Yeni Resim Seç
          </button>
        </div>
      </div>
      <canvas id="confetti-canvas"></canvas>
    </div>

    <!-- Telefon Dikey Uyarısı (Yatay Tutun Bildirimi) -->
    <div id="orientation-warning">
      <div class="phone-rotate-icon">📱 ➔ 📲</div>
      <h2>Lütfen Telefonu Yatay Çevirin</h2>
      <p>Daha eğlenceli ve rahat bir oyun için yatay mod önerilir!</p>
    </div>

  </div>

  <script src="presets.js"></script>
  <script src="audio.js"></script>
  <script src="puzzle.js"></script>
</body>
</html>
